<div class="reports-home container-fluid p-0">
  <header class="reports-home__header">
    <span class="reports-home__brand-tvs">TVS</span>
    <span class="reports-home__brand-horse" aria-hidden="true">🐎</span>
    <span class="reports-home__brand-title">Dealer Reports</span>
  </header>

  <ul class="reports-home__grid row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3 list-unstyled">
    @for (report of reports; track report.id) {
      <li class="reports-home__card col">
        <a [routerLink]="['/', report.route]" class="reports-home__card-link card h-100 text-decoration-none">
          <div class="card-body d-flex gap-3">
            <span class="reports-home__icon" [style.background]="cardStyle(report.id).color">
              <i class="bi {{ cardStyle(report.id).icon }}"></i>
            </span>
            <div class="d-flex flex-column gap-1">
              <h3 class="card-title h5 mb-0">{{ report.title }}</h3>
              <p class="card-text text-muted small mb-0">{{ report.description }}</p>
            </div>
          </div>
        </a>
      </li>
    }
  </ul>
</div>
