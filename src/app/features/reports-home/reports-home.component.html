<div class="reports-home container-fluid p-0">
  <header class="reports-home__header">
    <h1 class="reports-home__brand-title">TVS Dealer Reports</h1>
  </header>

  <ul class="reports-home__list list-unstyled">
    @for (report of reports; track report.id) {
      <li class="reports-home__row">
        <a [routerLink]="['/', report.route]" class="reports-home__row-link text-decoration-none">
          <span class="reports-home__row-title">{{ report.title }}</span>
          <span class="reports-home__row-description text-muted">{{ report.description }}</span>
        </a>
      </li>
    }
  </ul>
</div>
