<div class="warranty-reconciliation-list">
  <app-report-header-bar [title]="title" />
  <app-report-dealer-identity [dealerCode]="dealerCode()" [dealerName]="dealerName()" />

  <app-warranty-reconciliation-filter [config]="config()" (searched)="onSearch($event)" (reset)="onReset()" />

  @if (store.error(); as error) {
    <div class="warranty-reconciliation-list__error">
      <app-dismissible-alert [message]="error" (dismissed)="store.dismissError()" />
      <button type="button" class="__retry-btn" (click)="store.refresh()">Retry</button>
    </div>
  }

  @if (store.loading()) {
    <app-loading-indicator />
  } @else if (store.hasSearched() && store.data().length > 0) {
    <app-warranty-reconciliation-table
      class="warranty-reconciliation-list__table"
      [rows]="store.data()"
      [loading]="store.loading()"
      [exportFormats]="exportFormats()"
      [effectiveColumns]="store.effectiveColumns()"
      [dealerName]="config()?.context?.dealerDescription ?? null"
      (reset)="onTableReset()"
    />
  }
</div>
