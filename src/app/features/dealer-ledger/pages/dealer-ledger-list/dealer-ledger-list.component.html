<div class="dealer-ledger-list">
  <app-dealer-ledger-toolbar class="dealer-ledger-list__header" />

  <app-breadcrumb currentLabel="Dealer Ledger" />

  <app-dealer-ledger-filter
    class="dealer-ledger-list__filters"
    [config]="config()"
    (searched)="onSearch($event)"
    (reset)="onReset()"
  />

  @if (store.error(); as error) {
    <div class="dealer-ledger-list__error" role="alert">
      <p>{{ error }}</p>
      <button type="button" (click)="onRetry()">Retry</button>
    </div>
  }

  @if (store.hasSearched()) {
    <app-dealer-ledger-table
      class="dealer-ledger-list__table"
      [rows]="store.data()"
      [loading]="store.loading()"
      [resetDisabled]="!filter().hasActiveFilters()"
      [exportFormats]="exportFormats()"
      [effectiveColumns]="store.effectiveColumns()"
      [dealerName]="config()?.context?.dealerDescription ?? null"
      (reset)="onTableReset()"
    />
  }
</div>
