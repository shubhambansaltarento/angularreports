<div class="dealer-ledger-filter">
  <app-report-search-bar [initialValue]="initialValue()" [readonlyDealerFields]="true" [stacked]="true" />

  <div class="dealer-ledger-filter__checkbox-group" role="group" aria-labelledby="dealer-ledger-filter-checkbox-group-label">
    <span id="dealer-ledger-filter-checkbox-group-label" class="dealer-ledger-filter__checkbox-group-label">
      Include Details
      @if (selectedCheckboxCount() > 0) {
        <span class="dealer-ledger-filter__checkbox-count">({{ selectedCheckboxCount() }} selected)</span>
      }
    </span>
    <div class="dealer-ledger-filter__checkbox-options">
      @for (option of checkboxOptions; track option.key) {
        <label class="dealer-ledger-filter__checkbox">
          <input type="checkbox" [checked]="isChecked(option.key)" (change)="onCheckboxToggle(option.key)" />
          {{ option.label }}
        </label>
      }
    </div>
  </div>
</div>
