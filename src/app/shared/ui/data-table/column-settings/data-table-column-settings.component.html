<div class="data-table-column-settings">
  <label class="data-table-column-settings__search">
    <input
      type="text"
      class="form-control form-control-sm"
      placeholder="Search columns…"
      [value]="searchTerm()"
      (input)="onSearchInput($event)"
      aria-label="Search columns"
    />
  </label>

  <ul class="data-table-column-settings__list list-unstyled mb-0">
    @for (column of filteredColumns(); track column.key) {
      <li class="data-table-column-settings__item">
        <label class="data-table-column-settings__visibility form-check">
          <input
            type="checkbox"
            class="form-check-input"
            [checked]="!column.hidden"
            (change)="toggleVisibility.emit(column.key)"
          />
          <span class="form-check-label">{{ column.header }}</span>
        </label>

        <div class="data-table-column-settings__actions">
          <button
            type="button"
            class="btn btn-sm btn-outline-secondary"
            [disabled]="isFirst(column.key)"
            (click)="moveUp.emit(column.key)"
            aria-label="Move column up"
          >
            ↑
          </button>
          <button
            type="button"
            class="btn btn-sm btn-outline-secondary"
            [disabled]="isLast(column.key)"
            (click)="moveDown.emit(column.key)"
            aria-label="Move column down"
          >
            ↓
          </button>
          <select
            class="data-table-column-settings__pin form-select form-select-sm"
            [value]="column.pinned ?? ''"
            (change)="onPinChange(column.key, $event)"
            aria-label="Pin column"
          >
            <option value="">Unpinned</option>
            <option value="start">Pin left</option>
            <option value="end">Pin right</option>
          </select>
        </div>
      </li>
    }
  </ul>

  <button type="button" class="data-table-column-settings__restore btn btn-sm btn-outline-secondary" (click)="restoreDefaults.emit()">
    Restore Default
  </button>
</div>
