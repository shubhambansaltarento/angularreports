<section class="report-search-only-page">
  <header class="report-search-only-page__header">
    <h1>{{ title() }}</h1>
    @if (description()) {
      <p>{{ description() }}</p>
    }
  </header>

  <app-report-search-bar [initialValue]="initialValue()" />

  <div class="report-search-only-page__actions">
    <button type="button" (click)="onSearch()">Search</button>
    <button type="button" (click)="onReset()">Reset</button>
  </div>

  <p class="report-search-only-page__placeholder" role="status">
    The table for "{{ title() }}" is not yet available — its columns are pending confirmed source data.
  </p>
</section>
