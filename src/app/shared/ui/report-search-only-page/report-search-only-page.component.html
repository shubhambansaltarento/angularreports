<section class="report-search-only-page container-fluid p-0">
  <app-report-header-bar [title]="title()" />
  <app-report-dealer-identity [dealerCode]="dealerContext().dealerCode" [dealerName]="dealerContext().dealerDescription" />
  <div class="report-search-only-page__content">
    <app-report-search-bar [initialValue]="initialValue()" [readonlyDealerFields]="true" />

    <div class="report-search-only-page__actions d-flex gap-2">
      <button type="button" class="report-search-only-page__show-report-btn btn btn-sm" (click)="onSearch()">Show Report</button>
      <button type="button" class="btn btn-sm btn-outline-secondary" (click)="onReset()">Reset</button>
    </div>

    <app-data-table
      tableId="report-search-only-page"
      trackByKey="id"
      [columns]="placeholderColumns"
      [data]="placeholderRows"
    />
  </div>
</section>
