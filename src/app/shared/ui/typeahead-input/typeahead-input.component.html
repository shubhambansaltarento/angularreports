<div class="typeahead-input" [class.typeahead-input--compact]="compact()">
  @if (label()) {
    <label class="form-label" [for]="inputId()">{{ label() }}</label>
  }
  <input
    [id]="inputId()"
    type="text"
    class="form-control"
    [attr.list]="options().length ? datalistId : null"
    [placeholder]="placeholder()"
    [disabled]="disabled"
    [value]="value"
    (input)="onInput($any($event.target).value)"
    (blur)="onBlur()"
  />
  @if (options().length) {
    <datalist [id]="datalistId">
      @for (option of options(); track option) {
        <option [value]="option"></option>
      }
    </datalist>
  }
</div>
